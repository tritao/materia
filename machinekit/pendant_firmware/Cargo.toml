[package]
name = "pendant-firmware"
version = "0.1.0"
edition = "2021"
publish = false

[features]
# Bench: a Nucleo-G474RE with a CAN-FD transceiver on PA11 (RX) and PA12 (TX).
nucleo-g474 = ["embassy-stm32/stm32g474re", "embassy-stm32/single-bank"]
# The pendant's own MCU: STM32G0B1 (Cortex-M0+), same pins.
g0b1 = ["embassy-stm32/stm32g0b1re", "embassy-stm32/dual-bank"]

[dependencies]
embassy-stm32 = { version = "0.6", features = ["time-driver-any", "memory-x", "unstable-pac"] }
embassy-executor = { version = "0.10", features = ["platform-cortex-m", "executor-thread"] }
embassy-time = { version = "0.5", features = ["tick-hz-32_768"] }
cortex-m = { version = "0.7.6", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7"
panic-halt = "1"
operator-link = { path = "../operator_link" }
