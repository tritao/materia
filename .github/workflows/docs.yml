name: docs

on:
  push:
    paths: ["docs/**", "**/*.hx", "haxeon", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "**/*.hx", "haxeon", ".github/workflows/docs.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      # The API reference is parsed with Haxeon's own parser (docs/api/src/ApiXml.hx).
      - run: git submodule update --init --depth 1 haxeon
        working-directory: .
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      # Fails when docs/api/data no longer matches the kits' public API. Regenerate it in the same change with
      # `python3 docs/api/generate.py` (set MATERIA_API_SOURCE to a clean checkout to ignore uncommitted work).
      - run: HAXE=haxe python3 docs/api/generate.py --check
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # The live widgets' runtime is committed: warn when its inputs changed since it was built, and fail if it
      # no longer works.
      - run: python3 docs/runtime/inputs.py --check || echo "::warning::docs/runtime/docs-runtime.wasm is stale; run docs/runtime/build.sh"
        working-directory: .
      - run: node --experimental-strip-types docs/runtime/check.mjs
        working-directory: .
      # Fails on invalid front matter and broken internal links.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/dist
