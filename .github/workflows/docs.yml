name: docs

on:
  push:
    paths: ["docs/**", "**/*.hx", "haxeon", ".github/workflows/docs.yml"]
  pull_request:
    paths: ["docs/**", "**/*.hx", "haxeon", ".github/workflows/docs.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs/site
    steps:
      - uses: actions/checkout@v4
      # The API reference is parsed with Haxeon's own parser (docs/api/src/ApiXml.hx).
      - run: git submodule update --init --depth 1 haxeon
        working-directory: .
      - uses: krdlab/setup-haxe@v1
        with:
          haxe-version: 4.3.7
      # Warns when docs/api/data no longer matches the kits' public API (regenerate it with docs/api/generate.py).
      # A warning, not a failure: kit changes land from many places, and the data is refreshed separately.
      - run: HAXE=haxe python3 docs/api/generate.py --check || echo "::warning::docs/api/data is stale; run docs/api/generate.py"
        working-directory: .
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: docs/site/package-lock.json
      - run: npm ci
      # The live widgets' runtime is committed; fail when its inputs changed, then run it.
      - run: python3 docs/runtime/inputs.py --check && node --experimental-strip-types docs/runtime/check.mjs
        working-directory: .
      # Fails on invalid front matter and broken internal links.
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: docs-site
          path: docs/site/dist
